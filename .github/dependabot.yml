version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      ml:
        patterns: ["torch", "transformers", "sentence-transformers", "onnx*", "tokenizers"]
  - package-ecosystem: pip
    directory: /demo
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # El proyecto fija Python 3.12 (requires-python): solo parches de 3.12.x.
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: docker
    directory: /demo
    schedule:
      interval: weekly
    # El proyecto fija Python 3.12 (requires-python): solo parches de 3.12.x.
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
