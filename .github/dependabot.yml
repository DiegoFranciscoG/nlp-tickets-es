version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      ml:
        patterns: ["torch", "transformers", "sentence-transformers", "onnx*", "tokenizers"]
  - package-ecosystem: pip
    directory: /demo
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /demo
    schedule:
      interval: weekly
